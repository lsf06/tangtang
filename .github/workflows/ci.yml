name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f services/raspberry-pi/requirements.txt ]; then
          pip install -r services/raspberry-pi/requirements.txt
        fi
        pip install pytest pytest-cov
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Test with pytest
      run: |
        if [ -d tests ]; then
          pytest tests/ -v --cov=services --cov-report=xml || echo "No tests found or tests failed"
        else
          echo "No tests directory found, skipping tests"
        fi
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
    
    - name: Build web-portal/family
      working-directory: web-portal/family
      run: |
        if [ -f package.json ]; then
          npm install --legacy-peer-deps || npm install
          npm run build
        else
          echo "No package.json found, skipping"
        fi
      continue-on-error: true
    
    - name: Build web-portal/dashboard
      working-directory: web-portal/dashboard
      run: |
        if [ -f package.json ]; then
          npm install --legacy-peer-deps || npm install
          npm run build
        else
          echo "No package.json found, skipping"
        fi
      continue-on-error: true
    
    - name: Build web-portal/admin
      working-directory: web-portal/admin
      run: |
        if [ -f package.json ]; then
          npm install --legacy-peer-deps || npm install
          npm run build
        else
          echo "No package.json found, skipping"
        fi
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run safety check
      run: |
        pip install safety
        if [ -f services/raspberry-pi/requirements.txt ]; then
          safety check -r services/raspberry-pi/requirements.txt || echo "Security warnings found"
        fi
      continue-on-error: true