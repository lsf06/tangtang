<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家属监护端 - 健康管家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .patient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .patient-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .patient-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .patient-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            margin-right: 15px;
        }

        .patient-info h3 {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 3px;
        }

        .patient-info p {
            font-size: 13px;
            color: #64748b;
        }

        .status-indicator {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.warning {
            background: #fbbf24;
        }

        .status-dot.danger {
            background: #ef4444;
        }

        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .metric-item {
            text-align: center;
            padding: 10px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .metric-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
        }

        .metric-label {
            font-size: 12px;
            color: #64748b;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd6;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .alert-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .alert-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
        }

        .alert-item.warning {
            background: #fffbeb;
            border-left-color: #fbbf24;
        }

        .alert-icon {
            font-size: 24px;
            margin-right: 15px;
        }

        .alert-content {
            flex: 1;
        }

        .alert-title {
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 3px;
        }

        .alert-time {
            font-size: 12px;
            color: #64748b;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .history-table th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
        }

        .history-table tr:hover {
            background: #f8fafc;
        }

        .call-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .call-modal.active {
            display: flex;
        }

        .call-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .call-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            margin: 0 auto 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .call-status {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 20px;
        }

        .call-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .call-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .call-btn.hangup {
            background: #ef4444;
            color: white;
        }

        .call-btn.answer {
            background: #4ade80;
            color: white;
        }

        @media (max-width: 768px) {
            .patient-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍👩‍👧 家属监护端</h1>
        <p>实时监护家人健康状态</p>
    </div>

    <div class="container">
        <!-- 家人卡片列表 -->
        <div class="patient-grid" id="patientGrid">
            <!-- 动态生成 -->
        </div>

        <!-- 异常告警 -->
        <div class="section">
            <div class="section-title">🔔 异常告警</div>
            <div class="alert-list" id="alertList">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="section">
            <div class="section-title">📋 最近检测记录</div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>家人</th>
                        <th>心率</th>
                        <th>血氧</th>
                        <th>体温</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="historyTable">
                    <!-- 动态生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 通话弹窗 -->
    <div class="call-modal" id="callModal">
        <div class="call-content">
            <div class="call-avatar">👤</div>
            <div class="call-status" id="callStatus">正在呼叫...</div>
            <div class="call-buttons">
                <button class="call-btn hangup" onclick="endCall()">📞</button>
            </div>
        </div>
    </div>

    <script>
        // 家人数据
        const patients = [
            {
                id: 1,
                name: '张三',
                relation: '父亲',
                age: 68,
                heartRate: 72,
                bloodOxygen: 98,
                temperature: 36.5,
                status: 'normal',
                lastCheck: '2024-01-15 14:30'
            },
            {
                id: 2,
                name: '李四',
                relation: '母亲',
                age: 65,
                heartRate: 85,
                bloodOxygen: 94,
                temperature: 37.2,
                status: 'warning',
                lastCheck: '2024-01-15 14:25'
            },
            {
                id: 3,
                name: '王五',
                relation: '祖父',
                age: 78,
                heartRate: 55,
                bloodOxygen: 92,
                temperature: 36.8,
                status: 'danger',
                lastCheck: '2024-01-15 14:20'
            }
        ];

        // 告警数据
        const alerts = [
            {
                id: 1,
                title: '血氧偏低预警',
                patient: '王五',
                time: '14:20',
                type: 'danger'
            },
            {
                id: 2,
                title: '心率偏快',
                patient: '李四',
                time: '14:25',
                type: 'warning'
            },
            {
                id: 3,
                title: '体温略高',
                patient: '李四',
                time: '14:25',
                type: 'warning'
            }
        ];

        // 历史记录
        const historyRecords = [
            { time: '14:30', patient: '张三', heartRate: 72, bloodOxygen: 98, temperature: 36.5, status: 'normal' },
            { time: '14:25', patient: '李四', heartRate: 85, bloodOxygen: 94, temperature: 37.2, status: 'warning' },
            { time: '14:20', patient: '王五', heartRate: 55, bloodOxygen: 92, temperature: 36.8, status: 'danger' },
            { time: '14:15', patient: '张三', heartRate: 70, bloodOxygen: 99, temperature: 36.4, status: 'normal' },
            { time: '14:10', patient: '李四', heartRate: 78, bloodOxygen: 96, temperature: 36.9, status: 'normal' }
        ];

        // 渲染家人卡片
        function renderPatients() {
            const grid = document.getElementById('patientGrid');
            grid.innerHTML = patients.map(patient => `
                <div class="patient-card">
                    <div class="patient-header">
                        <div class="patient-avatar">${patient.name.charAt(0)}</div>
                        <div class="patient-info">
                            <h3>${patient.name}</h3>
                            <p>${patient.relation} · ${patient.age}岁</p>
                        </div>
                        <div class="status-indicator">
                            <div class="status-dot ${patient.status}"></div>
                        </div>
                    </div>
                    <div class="metrics-row">
                        <div class="metric-item">
                            <div class="metric-icon">💓</div>
                            <div class="metric-value">${patient.heartRate}</div>
                            <div class="metric-label">心率</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-icon">🫧</div>
                            <div class="metric-value">${patient.bloodOxygen}%</div>
                            <div class="metric-label">血氧</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-icon">🌡️</div>
                            <div class="metric-value">${patient.temperature}°C</div>
                            <div class="metric-label">体温</div>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="viewDetail(${patient.id})">查看详情</button>
                        <button class="btn btn-secondary" onclick="startCall('${patient.name}')">视频通话</button>
                    </div>
                </div>
            `).join('');
        }

        // 渲染告警列表
        function renderAlerts() {
            const list = document.getElementById('alertList');
            list.innerHTML = alerts.map(alert => `
                <div class="alert-item ${alert.type}">
                    <div class="alert-icon">${alert.type === 'danger' ? '🚨' : '⚠️'}</div>
                    <div class="alert-content">
                        <div class="alert-title">${alert.title} - ${alert.patient}</div>
                        <div class="alert-time">${alert.time}</div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染历史记录
        function renderHistory() {
            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = historyRecords.map(record => `
                <tr>
                    <td>${record.time}</td>
                    <td>${record.patient}</td>
                    <td>${record.heartRate} 次/分</td>
                    <td>${record.bloodOxygen}%</td>
                    <td>${record.temperature}°C</td>
                    <td>${record.status === 'normal' ? '<span style="color:#4ade80">正常</span>' : 
                          record.status === 'warning' ? '<span style="color:#fbbf24">警告</span>' : 
                          '<span style="color:#ef4444">异常</span>'}</td>
                </tr>
            `).join('');
        }

        // 查看详情
        function viewDetail(id) {
            const patient = patients.find(p => p.id === id);
            alert(`查看 ${patient.name} 的详细信息\n\n最近检测时间：${patient.lastCheck}\n\n状态：${patient.status === 'normal' ? '正常' : patient.status === 'warning' ? '需要注意' : '异常'}`);
        }

        // 开始通话
        function startCall(patientName) {
            const modal = document.getElementById('callModal');
            const status = document.getElementById('callStatus');
            modal.classList.add('active');
            status.textContent = `正在呼叫 ${patientName}...`;
            
            setTimeout(() => {
                status.textContent = `${patientName} 正在接听...`;
            }, 2000);
        }

        // 结束通话
        function endCall() {
            const modal = document.getElementById('callModal');
            const status = document.getElementById('callStatus');
            modal.classList.remove('active');
            status.textContent = '正在呼叫...';
        }

        // 初始化
        function init() {
            renderPatients();
            renderAlerts();
            renderHistory();
        }

        init();
    </script>
</body>
</html>
