<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康管家 - 患者端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .status-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .status-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            background: #4ade80;
            color: white;
        }

        .status-badge.warning {
            background: #fbbf24;
        }

        .status-badge.danger {
            background: #ef4444;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric {
            text-align: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 15px;
        }

        .metric-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 14px;
            color: #64748b;
        }

        .metric-unit {
            font-size: 14px;
            color: #94a3b8;
            margin-left: 2px;
        }

        .section-title {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .info-list {
            background: #f8fafc;
            border-radius: 15px;
            padding: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 16px;
            color: #64748b;
        }

        .info-value {
            font-size: 16px;
            color: #1e293b;
            font-weight: 500;
        }

        .action-buttons {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            border: none;
            border-radius: 15px;
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .trend-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .trend-chart {
            height: 150px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
            padding-top: 20px;
        }

        .trend-bar {
            flex: 1;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px 8px 0 0;
            min-height: 20px;
            position: relative;
        }

        .trend-bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #64748b;
            white-space: nowrap;
        }

        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 14px;
            opacity: 0.8;
        }

        /* 动画效果 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .metrics {
                grid-template-columns: 1fr;
            }
            
            .metric-value {
                font-size: 28px;
            }
            
            .btn {
                font-size: 18px;
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>🏥 健康管家</h1>
            <p>您的居家健康监护助手</p>
        </header>

        <!-- 健康状态卡片 -->
        <div class="status-card">
            <div class="status-header">
                <span class="status-badge" id="statusBadge">✓ 状态正常</span>
            </div>
            
            <!-- 核心指标 -->
            <div class="metrics">
                <div class="metric">
                    <div class="metric-icon">💓</div>
                    <div class="metric-value" id="heartRate">--<span class="metric-unit">次/分</span></div>
                    <div class="metric-label">心率</div>
                </div>
                <div class="metric">
                    <div class="metric-icon">🫧</div>
                    <div class="metric-value" id="bloodOxygen">--<span class="metric-unit">%</span></div>
                    <div class="metric-label">血氧</div>
                </div>
                <div class="metric">
                    <div class="metric-icon">🌡️</div>
                    <div class="metric-value" id="temperature">--<span class="metric-unit">°C</span></div>
                    <div class="metric-label">体温</div>
                </div>
            </div>

            <!-- 健康信息 -->
            <div class="section-title">健康信息</div>
            <div class="info-list">
                <div class="info-item">
                    <span class="info-label">上次检测</span>
                    <span class="info-value" id="lastCheck">--</span>
                </div>
                <div class="info-item">
                    <span class="info-label">今日检测次数</span>
                    <span class="info-value" id="todayCount">0 次</span>
                </div>
                <div class="info-item">
                    <span class="info-label">设备状态</span>
                    <span class="info-value" style="color: #4ade80;">● 在线</span>
                </div>
            </div>
        </div>

        <!-- 7 天趋势 -->
        <div class="trend-section">
            <div class="section-title">近 7 天健康趋势</div>
            <div class="trend-chart" id="trendChart">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="action-buttons">
            <button class="btn btn-primary" onclick="startDetection()">
                🔍 开始检测
            </button>
            <button class="btn btn-secondary" onclick="playVoiceReport()">
                🔊 语音播报
            </button>
            <button class="btn btn-danger pulse" onclick="emergencyCall()">
                🆘 紧急呼叫
            </button>
        </div>

        <!-- 底部 -->
        <footer class="footer">
            <p>设备 ID: HG-2024001 | 最后同步：<span id="syncTime">--</span></p>
        </footer>
    </div>

    <script>
        // 模拟数据（实际应从 API 获取）
        let healthData = {
            heartRate: 72,
            bloodOxygen: 98,
            temperature: 36.5,
            status: 'normal',
            lastCheck: '2024-01-15 14:30',
            todayCount: 5,
            trend: [98, 97, 98, 99, 98, 97, 98]
        };

        // 初始化页面
        function init() {
            updateDisplay();
            renderTrendChart();
            updateSyncTime();
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('heartRate').innerHTML = healthData.heartRate + '<span class="metric-unit">次/分</span>';
            document.getElementById('bloodOxygen').innerHTML = healthData.bloodOxygen + '<span class="metric-unit">%</span>';
            document.getElementById('temperature').innerHTML = healthData.temperature + '<span class="metric-unit">°C</span>';
            document.getElementById('lastCheck').textContent = healthData.lastCheck;
            document.getElementById('todayCount').textContent = healthData.todayCount + '次';

            // 更新状态徽章
            const badge = document.getElementById('statusBadge');
            if (healthData.status === 'normal') {
                badge.className = 'status-badge';
                badge.textContent = '✓ 状态正常';
            } else if (healthData.status === 'warning') {
                badge.className = 'status-badge warning';
                badge.textContent = '⚠ 需要注意';
            } else {
                badge.className = 'status-badge danger';
                badge.textContent = '⚠ 异常预警';
            }
        }

        // 渲染趋势图
        function renderTrendChart() {
            const chart = document.getElementById('trendChart');
            const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            const maxVal = Math.max(...healthData.trend);
            
            chart.innerHTML = healthData.trend.map((val, i) => {
                const height = (val / maxVal) * 100;
                return `
                    <div class="trend-bar" style="height: ${height}%">
                        <span class="trend-bar-label">${days[i]}</span>
                    </div>
                `;
            }).join('');
        }

        // 开始检测
        function startDetection() {
            alert('正在检测中...\n\n请将手指放入检测槽，等待 30 秒');
            // 实际实现：调用 API 触发检测
        }

        // 语音播报
        function playVoiceReport() {
            const text = `您的血氧饱和度${healthData.bloodOxygen}%，心率${healthData.heartRate}次每分，体温${healthData.temperature}摄氏度，状态正常。`;
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'zh-CN';
            speech.rate = 0.8;
            speechSynthesis.speak(speech);
        }

        // 紧急呼叫
        function emergencyCall() {
            if (confirm('确定要呼叫家属吗？')) {
                alert('正在呼叫家属...\n\n请保持电话畅通');
                // 实际实现：调用 API 触发呼叫
            }
        }

        // 更新同步时间
        function updateSyncTime() {
            const now = new Date();
            document.getElementById('syncTime').textContent = now.toLocaleTimeString('zh-CN');
        }

        // 每 30 秒更新一次同步时间
        setInterval(updateSyncTime, 30000);

        // 页面加载时初始化
        init();
    </script>
</body>
</html>
