<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康数据大屏 - 健康管家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a192f 0%, #1a284a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #667eea, #4ade80, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            opacity: 0.7;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-card .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 14px;
            opacity: 0.7;
        }

        .stat-card .trend {
            font-size: 12px;
            margin-top: 10px;
        }

        .stat-card .trend.up {
            color: #4ade80;
        }

        .stat-card .trend.down {
            color: #ef4444;
        }

        .main-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .section-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-container {
            height: 300px;
            position: relative;
        }

        #trendCanvas {
            width: 100%;
            height: 100%;
        }

        .alert-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .alert-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
        }

        .alert-item.warning {
            background: rgba(251, 191, 36, 0.1);
            border-left-color: #fbbf24;
        }

        .alert-item .icon {
            font-size: 24px;
            margin-right: 15px;
        }

        .alert-item .content {
            flex: 1;
        }

        .alert-item .title {
            font-weight: 500;
            margin-bottom: 3px;
        }

        .alert-item .time {
            font-size: 12px;
            opacity: 0.6;
        }

        .bottom-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .patient-list {
            max-height: 250px;
            overflow-y: auto;
        }

        .patient-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .patient-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: bold;
        }

        .patient-item .info {
            flex: 1;
        }

        .patient-item .name {
            font-weight: 500;
            margin-bottom: 3px;
        }

        .patient-item .metrics {
            display: flex;
            gap: 15px;
            font-size: 12px;
            opacity: 0.7;
        }

        .patient-item .status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .patient-item .status.normal {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .patient-item .status.warning {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .patient-item .status.danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .device-item {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .device-item .icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .device-item .name {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .device-item .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 12px;
        }

        .device-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .device-item .status-dot.online {
            background: #4ade80;
        }

        .device-item .status-dot.offline {
            background: #64748b;
        }

        .heatmap-container {
            height: 200px;
            margin-top: 15px;
        }

        #heatmapCanvas {
            width: 100%;
            height: 100%;
        }

        .heatmap-legend {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.7;
        }

        .heatmap-colors {
            flex: 1;
            height: 10px;
            background: linear-gradient(90deg, #1e3a5f, #3b82f6, #4ade80, #fbbf24, #ef4444);
            border-radius: 5px;
        }

        @media (max-width: 1200px) {
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
            .main-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .bottom-section {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 24px;
            }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }

        /* 实时更新动画 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .updating {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 健康数据大屏</h1>
        <p>实时监控 · 数据分析 · 异常预警</p>
    </div>

    <!-- 统计卡片 -->
    <div class="dashboard">
        <div class="stat-card">
            <div class="icon">👥</div>
            <div class="value" id="totalPatients">0</div>
            <div class="label">监护人数</div>
            <div class="trend up">↑ 较昨日 +2</div>
        </div>
        <div class="stat-card">
            <div class="icon">💓</div>
            <div class="value" id="avgHeartRate">0</div>
            <div class="label">平均心率 (次/分)</div>
            <div class="trend down">↓ 较昨日 -3</div>
        </div>
        <div class="stat-card">
            <div class="icon">🫧</div>
            <div class="value" id="avgBloodOxygen">0%</div>
            <div class="label">平均血氧</div>
            <div class="trend up">↑ 较昨日 +1%</div>
        </div>
        <div class="stat-card">
            <div class="icon">🔔</div>
            <div class="value" id="alertCount">0</div>
            <div class="label">待处理告警</div>
            <div class="trend down">↓ 较昨日 -2</div>
        </div>
    </div>

    <!-- 主要区域 -->
    <div class="main-section">
        <!-- 24 小时趋势图 -->
        <div class="section-card">
            <div class="section-title">
                <span>📈</span> 24 小时健康趋势
            </div>
            <div class="chart-container">
                <canvas id="trendCanvas"></canvas>
            </div>
        </div>

        <!-- 告警列表 -->
        <div class="section-card">
            <div class="section-title">
                <span>🚨</span> 实时告警
            </div>
            <div class="alert-list" id="alertList">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <!-- 底部区域 -->
    <div class="bottom-section">
        <!-- 监护对象列表 -->
        <div class="section-card">
            <div class="section-title">
                <span>👤</span> 监护对象
            </div>
            <div class="patient-list" id="patientList">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 设备状态 -->
        <div class="section-card">
            <div class="section-title">
                <span>🔧</span> 设备状态
            </div>
            <div class="device-grid" id="deviceGrid">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <!-- 热力图区域 -->
    <div class="section-card" style="margin-top: 20px;">
        <div class="section-title">
            <span>🔥</span> 24 小时检测热度
        </div>
        <div class="heatmap-container">
            <canvas id="heatmapCanvas"></canvas>
        </div>
        <div class="heatmap-legend">
            <span>低</span>
            <div class="heatmap-colors"></div>
            <span>高</span>
        </div>
    </div>

    <script>
        // 模拟数据
        const patients = [
            { id: 1, name: '张三', heartRate: 72, bloodOxygen: 98, temperature: 36.5, status: 'normal' },
            { id: 2, name: '李四', heartRate: 85, bloodOxygen: 94, temperature: 37.2, status: 'warning' },
            { id: 3, name: '王五', heartRate: 55, bloodOxygen: 92, temperature: 36.8, status: 'danger' },
            { id: 4, name: '赵六', heartRate: 78, bloodOxygen: 97, temperature: 36.6, status: 'normal' },
            { id: 5, name: '孙七', heartRate: 70, bloodOxygen: 99, temperature: 36.4, status: 'normal' }
        ];

        const alerts = [
            { type: '血氧偏低', patient: '王五', value: '92%', time: '14:20', level: 'danger' },
            { type: '心率偏快', patient: '李四', value: '85 次/分', time: '14:25', level: 'warning' },
            { type: '体温略高', patient: '李四', value: '37.2°C', time: '14:25', level: 'warning' },
            { type: '心率过缓', patient: '王五', value: '55 次/分', time: '14:18', level: 'danger' }
        ];

        const devices = [
            { id: 'DEV001', name: '检测仪 A', status: 'online' },
            { id: 'DEV002', name: '检测仪 B', status: 'online' },
            { id: 'DEV003', name: '检测仪 C', status: 'offline' },
            { id: 'DEV004', name: '检测仪 D', status: 'online' }
        ];

        // 24 小时趋势数据
        const trendData = {
            hours: Array.from({length: 24}, (_, i) => `${i}:00`),
            heartRate: [70, 72, 71, 68, 65, 63, 62, 64, 68, 72, 75, 78, 80, 77, 74, 72, 70, 68, 67, 69, 72, 74, 73, 71],
            bloodOxygen: [98, 98, 97, 97, 96, 96, 95, 96, 97, 98, 98, 97, 96, 95, 96, 97, 98, 98, 97, 97, 98, 98, 97, 98]
        };

        // 热力图数据 (24 小时 x 7 天)
        const heatmapData = Array.from({length: 24}, () => 
            Array.from({length: 7}, () => Math.floor(Math.random() * 100))
        );

        // 渲染统计卡片
        function renderStats() {
            document.getElementById('totalPatients').textContent = patients.length;
            document.getElementById('avgHeartRate').textContent = Math.round(patients.reduce((sum, p) => sum + p.heartRate, 0) / patients.length);
            document.getElementById('avgBloodOxygen').textContent = Math.round(patients.reduce((sum, p) => sum + p.bloodOxygen, 0) / patients.length) + '%';
            document.getElementById('alertCount').textContent = alerts.length;
        }

        // 渲染告警列表
        function renderAlerts() {
            const list = document.getElementById('alertList');
            list.innerHTML = alerts.map(alert => `
                <div class="alert-item ${alert.level}">
                    <div class="icon">${alert.level === 'danger' ? '🚨' : '⚠️'}</div>
                    <div class="content">
                        <div class="title">${alert.type} - ${alert.patient}</div>
                        <div class="time">${alert.time} · ${alert.value}</div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染监护对象列表
        function renderPatientList() {
            const list = document.getElementById('patientList');
            list.innerHTML = patients.map(patient => `
                <div class="patient-item">
                    <div class="avatar">${patient.name.charAt(0)}</div>
                    <div class="info">
                        <div class="name">${patient.name}</div>
                        <div class="metrics">
                            <span>💓 ${patient.heartRate}</span>
                            <span>🫧 ${patient.bloodOxygen}%</span>
                            <span>🌡️ ${patient.temperature}°C</span>
                        </div>
                    </div>
                    <div class="status ${patient.status}">
                        ${patient.status === 'normal' ? '正常' : patient.status === 'warning' ? '警告' : '异常'}
                    </div>
                </div>
            `).join('');
        }

        // 渲染设备状态
        function renderDevices() {
            const grid = document.getElementById('deviceGrid');
            grid.innerHTML = devices.map(device => `
                <div class="device-item">
                    <div class="icon">🔧</div>
                    <div class="name">${device.name}</div>
                    <div class="status">
                        <span class="status-dot ${device.status}"></span>
                        ${device.status === 'online' ? '在线' : '离线'}
                    </div>
                </div>
            `).join('');
        }

        // 绘制趋势图
        function drawTrendChart() {
            const canvas = document.getElementById('trendCanvas');
            const ctx = canvas.getContext('2d');
            
            // 设置 canvas 尺寸
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);

            const width = rect.width;
            const height = rect.height;
            const padding = { top: 20, right: 20, bottom: 30, left: 50 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制网格
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;

            // 水平网格线
            for (let i = 0; i <= 5; i++) {
                const y = padding.top + (chartHeight / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();

                // Y 轴标签
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'right';
                const value = 100 - i * 10;
                ctx.fillText(value, padding.left - 10, y + 3);
            }

            // 绘制心率曲线
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const heartRatePoints = trendData.heartRate.map((val, i) => ({
                x: padding.left + (chartWidth / (trendData.hours.length - 1)) * i,
                y: padding.top + chartHeight - ((val - 50) / 50) * chartHeight
            }));

            ctx.moveTo(heartRatePoints[0].x, heartRatePoints[0].y);
            heartRatePoints.forEach(point => ctx.lineTo(point.x, point.y));
            ctx.stroke();

            // 绘制血氧曲线
            ctx.strokeStyle = '#4ade80';
            ctx.beginPath();

            const bloodOxygenPoints = trendData.bloodOxygen.map((val, i) => ({
                x: padding.left + (chartWidth / (trendData.hours.length - 1)) * i,
                y: padding.top + chartHeight - ((val - 80) / 20) * chartHeight
            }));

            ctx.moveTo(bloodOxygenPoints[0].x, bloodOxygenPoints[0].y);
            bloodOxygenPoints.forEach(point => ctx.lineTo(point.x, point.y));
            ctx.stroke();

            // 绘制 X 轴标签 (每隔 4 小时显示)
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            trendData.hours.forEach((hour, i) => {
                if (i % 4 === 0) {
                    const x = padding.left + (chartWidth / (trendData.hours.length - 1)) * i;
                    ctx.fillText(hour, x, height - 5);
                }
            });

            // 绘制图例
            ctx.fillStyle = '#667eea';
            ctx.fillRect(width - 120, 10, 12, 12);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('心率', width - 105, 20);

            ctx.fillStyle = '#4ade80';
            ctx.fillRect(width - 60, 10, 12, 12);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText('血氧', width - 45, 20);
        }

        // 绘制热力图
        function drawHeatmap() {
            const canvas = document.getElementById('heatmapCanvas');
            const ctx = canvas.getContext('2d');

            // 设置 canvas 尺寸
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);

            const width = rect.width;
            const height = rect.height;
            const cellWidth = (width - 60) / 7;
            const cellHeight = (height - 20) / 24;

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制热力图单元格
            for (let hour = 0; hour < 24; hour++) {
                for (let day = 0; day < 7; day++) {
                    const value = heatmapData[hour][day];
                    const x = 50 + day * cellWidth;
                    const y = hour * cellHeight;

                    // 根据值设置颜色
                    let color;
                    if (value < 20) {
                        color = '#1e3a5f';
                    } else if (value < 40) {
                        color = '#3b82f6';
                    } else if (value < 60) {
                        color = '#60a5fa';
                    } else if (value < 80) {
                        color = '#4ade80';
                    } else {
                        color = '#fbbf24';
                    }

                    ctx.fillStyle = color;
                    ctx.fillRect(x + 2, y + 2, cellWidth - 4, cellHeight - 4);
                }
            }

            // 绘制 Y 轴标签 (时间)
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'right';
            for (let hour = 0; hour < 24; hour++) {
                if (hour % 3 === 0) {
                    ctx.fillText(`${hour}:00`, 45, hour * cellHeight + cellHeight / 2 + 3);
                }
            }

            // 绘制 X 轴标签 (星期)
            const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            ctx.textAlign = 'center';
            days.forEach((day, i) => {
                ctx.fillText(day, 50 + i * cellWidth + cellWidth / 2, height - 2);
            });
        }

        // 初始化
        function init() {
            renderStats();
            renderAlerts();
            renderPatientList();
            renderDevices();
            drawTrendChart();
            drawHeatmap();
        }

        // 页面加载时初始化
        init();

        // 窗口大小改变时重绘图表
        window.addEventListener('resize', () => {
            drawTrendChart();
            drawHeatmap();
        });

        // 每 5 秒模拟数据更新
        setInterval(() => {
            // 随机更新患者数据
            patients.forEach(patient => {
                patient.heartRate += Math.floor(Math.random() * 5) - 2;
                patient.bloodOxygen += Math.floor(Math.random() * 3) - 1;
                patient.temperature = (36 + Math.random() * 1.5).toFixed(1);

                // 更新状态
                if (patient.heartRate < 60 || patient.heartRate > 100 || patient.bloodOxygen < 93) {
                    patient.status = 'danger';
                } else if (patient.heartRate < 65 || patient.heartRate > 90 || patient.bloodOxygen < 95) {
                    patient.status = 'warning';
                } else {
                    patient.status = 'normal';
                }
            });

            renderStats();
            renderPatientList();
        }, 5000);
    </script>
</body>
</html>
